# This workflow will build a Java project with Maven, and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-maven

name: Java CI with Maven

on:
  push:
    branches: [ "main", "patched-releases" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: ['17', '21', '25', '26']

    steps:
    - uses: actions/checkout@v6
    - name: Set up JDK
      uses: actions/setup-java@v5
      with:
        java-version: ${{ matrix.java }}
        distribution: temurin
        cache: maven
    - name: Build with Maven
      run: mvn -ntp -B -Dstyle.color=always package -Dgpg.skip=true -Drevision=0.0.0-SNAPSHOT --file pom.xml
    - name: Generate SHA1 checksums
      run: |
        find . \( -name "pom.xml" -o -path "*/Output/maven/*.jar" \) -type f -print0 | while IFS= read -r -d '' file; do
          sha1sum "$file" | awk '{print $1}' > "$file.sha1"
        done
    - name: Upload Maven artifacts
      uses: actions/upload-artifact@v4
      with:
        name: maven-artifacts-java-${{ matrix.java }}
        path: |
          **/pom.xml
          **/pom.xml.sha1
          **/Output/maven/*.jar
          **/Output/maven/*.jar.sha1
